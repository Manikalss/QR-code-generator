<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Code Generator</title>
</head>

<body>
    <h1>QR Code Generator</h1>
    
    <form action="/" method="GET">
    <input name="url" placeholder="enter a url" maxlength="900" required>
    <button type="submit">Enter</button>
    </form>
    
    {% if qr64 %}
    <img src="data:image/png;base64,{{ qr64 }}" alt="Your QR Code">
    {% endif %}
    
</body>
</html>
